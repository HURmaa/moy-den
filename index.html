<style>
/* Layout: one-column phone app — sticky date bar, day cards, fixed bottom tabs */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#F4F6F9; --ink:#141A22; --muted:#5D6878; --line:#DCE1E8;
  --accent:#2F55D4; --on-accent:#FFFFFF;
  --sleep:#6A57CF; --water:#178FBA; --food:#D9711A; --piggy:#B8861F; --danger:#C93C4F; --ok:#2E9157; --warn:#C98A12; --mass:#1E9488;
  --c-food:#3A9D5D; --c-transfer:#3B6FE0; --c-fuel:#D2475A; --c-market:#9B4FD0; --c-other:#7A8594;
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1318; --surface:#171E26; --sunk:#1E2731; --ink:#E8EDF3; --muted:#93A1B2; --line:#28323E;
  --accent:#7F9BFF; --on-accent:#0E1318;
  --sleep:#9D8CF5; --water:#45BDE6; --food:#F29A4A; --piggy:#E2B24C; --danger:#F06C7E; --ok:#5CC786; --warn:#E8B44A; --mass:#3CC4B5;
  --c-food:#5CC27D; --c-transfer:#6F95F5; --c-fuel:#F06C7E; --c-market:#BF85F0; --c-other:#9AA5B2;
  color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.datebtn{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.datebtn b{display:block;font:700 clamp(15px,4.6vw,20px)/1.15 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebtn small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.synced{background:var(--ok)} .dot.err{background:var(--danger)} .dot.pending{background:var(--warn)}
.nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:12px;padding-block:4px 16px}

/* summary */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{background:var(--surface);border-radius:var(--r);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;text-align:center}
.ring svg{width:64px;height:64px}
.ring .v{font:700 15px/1.1 var(--display)}
.ring .l{font-size:12px;color:var(--muted)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font:700 19px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12.5px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--danger)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:80px}
.card h2{margin:0;font:600 16px/1.2 var(--body);display:flex;align-items:center;gap:8px}
.card h2 .sw{width:10px;height:10px;border-radius:3px}
.card h2 .hv{margin-left:auto;font:500 14px var(--body);color:var(--muted)}
.card.signin{border:1px dashed var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:0 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
.btn{height:44px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 16px;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.chip{height:34px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);padding:0 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick input:checked + .chip{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catpick input:focus-visible + .chip{outline:2px solid var(--accent);outline-offset:2px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li .t small{display:block;color:var(--muted);font-size:12.5px}
.li .a{font-weight:600;white-space:nowrap}
.x{width:32px;height:32px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:18px;flex:none}
.empty{color:var(--muted);font-size:13.5px;margin:0}

/* sleep */
.stepper{display:flex;align-items:center;gap:10px}
.stepper .big{font:700 30px/1 var(--display);min-width:92px;text-align:center}
.stepper .big small{font:500 14px var(--body);color:var(--muted)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}

/* water */
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:22px;height:30px;border-radius:3px 3px 7px 7px;border:2px solid var(--water);opacity:.35}
.glass.on{background:var(--water);opacity:1}

/* tasks */
.check{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list .check:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--on-accent)}
.on .box{background:var(--accent);border-color:var(--accent)}
.on .t{color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* stats */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--body)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.kv .lab{display:flex;align-items:center;gap:8px;min-width:0}

/* settings */
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0}
/* food search */
.mealform{display:flex;flex-direction:column;gap:8px}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:300px;overflow-y:auto}
.sug button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px}
.sug button:first-child{border-top:0}
.sug button:hover,.sug button:focus-visible{background:var(--sunk)}
.sug small{color:var(--muted);font-size:12px}
.pickinfo{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:6px 6px 6px 12px;font-size:13px;color:var(--muted)}
.pickinfo span{flex:1;min-width:0}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calc{font-weight:600;text-align:right}
/* body */
.bmi{display:flex;flex-direction:column;gap:6px}
.bmiscale{position:relative;display:flex;height:8px;border-radius:99px;overflow:visible}
.bmiscale i{height:100%;opacity:.55}
.bmiscale i:first-child{border-radius:99px 0 0 99px}.bmiscale i:nth-child(4){border-radius:0 99px 99px 0}
.bmiscale b{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.bmilab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.alert{margin:0;font-size:13.5px;background:var(--sunk);border-radius:12px;padding:10px 12px;color:var(--ink)}
.alert::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:8px;vertical-align:1px}
.alt summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:4px 0}
.emailform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:36px;height:36px;border-radius:50%;flex:none}
.who div{min-width:0;overflow-wrap:anywhere}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:6px}
.tabs button{height:52px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:7;max-width:calc(100% - 32px)}
@media (max-width:360px){.ring svg{width:54px;height:54px}.tile .v{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.bar i,.ring circle{transition:width .3s,stroke-dashoffset .4s}}
</style>

const FOODS=FOOD_RAW.trim().split('\n').map(l=>{const [n,k,p,g,u]=l.split('|');return {n,k:+k,p:+p,g:+g,u}});
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
function findFoods(q){
  q=norm(q).trim();if(q.length<2)return [];
  const words=q.split(/\s+/);
  const pool=[...(S.customFoods||[]).map(c=>({n:c.n,k:num(c.k),p:num(c.p),custom:true})),...FOODS];
  const res=[];
  pool.forEach((f,idx)=>{
    const nn=norm(f.n);if(!words.every(w=>nn.includes(w)))return;
    const score=(nn.startsWith(q)?0:nn.split(/[\s(,\-/]+/).some(w=>w.startsWith(words[0]))?1:2)-(f.custom?0.5:0);
    res.push({f,score,idx});
  });
  // ties keep the base order, where the everyday cooked variant comes first
  return res.sort((a,b)=>a.score-b.score||a.idx-b.idx).slice(0,8).map(r=>r.f);
}
const knownFood=name=>FOODS.some(f=>norm(f.n)===norm(name))||(S.customFoods||[]).some(f=>norm(f.n)===norm(name));
let pick=null, lastSug=[];
function calcPick(){return pick.custom?{kcal:pick.k*pick.q,prot:pick.p*pick.q}:{kcal:pick.k*pick.q/100,prot:pick.p*pick.q/100}}
const LS='moy-den-v1';

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);

const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
const fmt=n=>nf.format(Math.round(n*10)/10);
const rub=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽';
const num=v=>{const n=parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isFinite(n)?n:0};
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function shift(k,n){const d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function todayKey(){return key(new Date())}
const blank=()=>({sleep:null,bed:'',wake:'',water:0,meals:[],spend:[],piggy:[],tasks:[],habits:{},weight:null,steps:null});
const day=k=>Object.assign(blank(),days[k]||{});
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const kcal=d=>sum(d.meals,m=>num(m.kcal));
const prot=d=>sum(d.meals,m=>num(m.prot));

const piggyBalance=()=>num(S.piggyStart)+sum(Object.values(days),d=>piggyDelta(Object.assign(blank(),d)));

/* ---------- storage: phone first, cloud when signed in ---------- */
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S=Object.assign(structuredClone(DEF),j.settings||{});days=j.days||{};lastCat=j.lastCat||lastCat}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({settings:S,days,lastCat}))}catch(e){}}

const timers={};
const dirty=k=>!!timers[k]||unsynced.has(k);
function persist(k){
  saveLocal();
  if(!fs){unsynced.add(k);return}
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{timers[k]=null;flush(k)},400);
}
function flush(k){
  if(!fs)return;
  const body=k==='settings'?{...S}:{...day(k),date:k};
  const ref=k==='settings'?fs.settingsRef:fs.dayRef(k);
  // Firestore applies the write to the phone's cache at once and sends it when online
  fs.setDoc(ref,JSON.parse(JSON.stringify(body))).catch(e=>{console.warn(e);setSync('err')});
}
function mutate(k,fn){const d=structuredClone(day(k));fn(d);days[k]=d;persist(k);render()}
function setSettings(fn){fn(S);persist('settings');render()}

function setSync(s){
  sync=s;
  $('#sdot').className='dot '+s;
  $('#slabel').textContent={
    local:'Только на этом телефоне',
    synced:'Сохранено в облаке',
    pending:'В телефоне, ждёт отправки в облако',
    offline:'Нет сети, данные в телефоне',
    err:'Ошибка синхронизации'}[s]||'';
}

async function initFirebase(){
  let app,auth,store;
  try{
    const [A,U,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    app=A.initializeApp(FIREBASE_CONFIG);
    // The popup helper loads a page from firebaseapp.com that Chrome blocks inside an installed app,
    // and waiting on it stalls every sign-in, so the installed app runs without it (email only)
    auth=U.initializeAuth(app,{
      persistence:[U.indexedDBLocalPersistence,U.browserLocalPersistence],
      ...(isStandalone()?{}:{popupRedirectResolver:U.browserPopupRedirectResolver})});
    store=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
    window.__fb={U,F,auth};
    U.onAuthStateChanged(auth,user=>{authReady=true;if(user)attach(user,F,store);else detach();render()});
  }catch(e){console.warn('Firebase не загрузился',e);authReady=true;setSync('local');render()}
}

let unsubs=[];
function attach(user,F,store){
  detach(true);
  me={name:user.displayName||'',email:user.email||'',photo:user.photoURL||''};
  const base=['users',user.uid];
  fs={setDoc:F.setDoc,settingsRef:F.doc(store,...base,'meta','settings'),dayRef:k=>F.doc(store,...base,'days',k)};
  const migKey='moy-den-migrated-'+user.uid;
  let migrated=false;try{migrated=!!localStorage.getItem(migKey)}catch(e){}

  unsubs.push(F.onSnapshot(fs.settingsRef,snap=>{
    if(snap.exists()){if(!dirty('settings')){S=Object.assign(structuredClone(DEF),snap.data());saveLocal();render()}}
    else if(!snap.metadata.fromCache)persist('settings');
  },e=>{console.warn(e);setSync('err')}));

  const q=F.query(F.collection(store,...base,'days'),F.orderBy('date','desc'),F.limit(1500));
  unsubs.push(F.onSnapshot(q,{includeMetadataChanges:true},snap=>{
    for(const d of snap.docs){if(dirty(d.id))continue;const v=d.data();delete v.date;days[d.id]=v}
    if(!migrated&&!snap.metadata.fromCache){
      migrated=true;try{localStorage.setItem(migKey,'1')}catch(e){}
      // first sign-in with an empty cloud: upload what is already on the phone
      if(snap.empty)Object.keys(days).filter(isDayKey).forEach(k=>persist(k));
    }
    setSync(snap.metadata.hasPendingWrites?'pending':snap.metadata.fromCache&&!navigator.onLine?'offline':'synced');
    saveLocal();render();
  },e=>{console.warn(e);setSync('err')}));

  [...unsynced].forEach(k=>{unsynced.delete(k);persist(k)});
}
function detach(keepMe){unsubs.forEach(u=>u());unsubs=[];fs=null;if(!keepMe){me=null;setSync('local')}}

function authErr(e){
  const c=(e&&e.code)||'';
  return {
    'auth/unauthorized-domain':'домен hurmaa.github.io не добавлен в Firebase (Authentication → Settings → Authorized domains)',
    'auth/operation-not-allowed':'этот способ входа не включён в Firebase (Authentication → Sign-in method)',
    'auth/network-request-failed':'нет связи с сервером, проверьте интернет',
    'auth/invalid-credential':'неверная почта или пароль',
    'auth/wrong-password':'неверная почта или пароль',
    'auth/user-not-found':'такого аккаунта нет, нажмите «Создать аккаунт»',
    'auth/email-already-in-use':'аккаунт с этой почтой уже есть, нажмите «Войти»',
    'auth/weak-password':'пароль должен быть не короче 6 символов',
    'auth/invalid-email':'почта введена с ошибкой',
    'auth/too-many-requests':'слишком много попыток, подождите пару минут'}[c]||c||(e&&e.message)||'неизвестная ошибка';
}

  // navigator.onLine is unreliable on phones, so let Firebase report real network errors
  if(!window.__fb){toast('Облако не загрузилось. Проверьте интернет и перезапустите приложение');return false}
  return true;
}
async function login(){
  if(!fbReady())return;
  const {U,auth}=window.__fb,prov=new U.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  if(isStandalone()){toast('В приложении входите по почте и паролю');return}
  try{await U.signInWithPopup(auth,prov)}
  catch(e){
    if(e.code==='auth/popup-blocked'){toast('Браузер заблокировал окно входа. Разрешите всплывающие окна для этого сайта');return}
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
    toast('Не удалось войти: '+authErr(e));
  }
}
let authBusy=false;
async function emailAuth(create){
  if(authBusy){toast('Подождите, вход уже выполняется…');return}
  if(!fbReady())return;
  const email=($('#a-email')?.value||'').trim(),pass=$('#a-pass')?.value||'';
  if(!email||!pass){toast('Впишите почту и пароль');return}
  const {U,auth}=window.__fb;
  authBusy=true;
  toast(create?'Создаю аккаунт…':'Вхожу…');
  const slow=setTimeout(()=>{if(authBusy)toast('Сервер долго не отвечает. Закройте приложение и откройте снова, повторно не нажимайте')},15000);
  try{
    if(create)await U.createUserWithEmailAndPassword(auth,email,pass);
    else await U.signInWithEmailAndPassword(auth,email,pass);
    toast('Вход выполнен');
  }catch(e){toast('Не удалось: '+authErr(e))}
  finally{authBusy=false;clearTimeout(slow)}
}
let altOpen=false;
function signinBlock(){
  // Chrome blocks Google sign-in inside an installed app, so there email is the way in
  const sa=isStandalone();
  return `${sa?'':`<button class="btn" data-act="login">Войти через Google</button>`}
  <details class="alt" ${sa||altOpen?'open':''}><summary>${sa?'Вход по почте и паролю':'Войти по почте и паролю'}</summary>
    <form data-form="email" class="emailform">
      <input class="inp" id="a-email" type="email" autocomplete="email" placeholder="Почта">

async function logout(){if(window.__fb){await window.__fb.U.signOut(window.__fb.auth);toast('Вы вышли. Данные остались на телефоне')}}

/* ---------- backup ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({app:'moy-den',version:1,exportedAt:new Date().toISOString(),settings:S,days},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moy-den-'+todayKey()+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('#importfile').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const j=JSON.parse(await file.text());
    if(!j||typeof j.days!=='object')throw 0;
    let n=0;for(const k in j.days){if(isDayKey(k)){days[k]=Object.assign(blank(),j.days[k]);persist(k);n++}}
    if(j.settings){S=Object.assign(structuredClone(DEF),j.settings);persist('settings')}
    render();toast('Загружено дней: '+n);
  }catch(err){toast('Это не файл резервной копии «Мой день»')}
});

/* ---------- render helpers ---------- */
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function dateLabel(k){
  const d=parse(k),t=todayKey();
  const base=d.getDate()+' '+MONTHS[d.getMonth()];
  if(k===t)return 'Сегодня, '+base;
  if(k===shift(t,-1))return 'Вчера, '+base;
  if(k===shift(t,1))return 'Завтра, '+base;
  return WD[d.getDay()]+', '+base;
}
function ring(p,color,val,label,target){
  const r=26,C=2*Math.PI*r;
  return `<button class="ring" data-go="${target}"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" fill="var(--ink)" style="font:600 13px var(--body)">${Math.round(p*100)}%</text></svg><span class="v num">${val}</span><span class="l">${label}</span></button>`;
}
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.round(p*100)}%;background:${c}"></i></div>`;
const signed=n=>(n>0?'+':n<0?'−':'')+rub(Math.abs(n));
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}

function recentMeals(){
  const seen=new Map();
  for(let i=0;i<21;i++){for(const m of day(shift(cur,-i)).meals){const k=(m.name||'').trim().toLowerCase();if(k&&!seen.has(k))seen.set(k,m)}}
  return [...seen.values()].slice(0,8);
}

/* ---------- food form ---------- */

  if(!pick)return `<form data-form="meal" class="mealform">${name}

  const c=calcPick(), mults=[0.5,1,1.5,2];
  const info=pick.custom?`Моё блюдо: ${fmt(pick.k)} ккал и ${fmt(pick.p)} г белка за порцию`:`${fmt(pick.k)} ккал и ${fmt(pick.p)} г белка на 100 г · ${esc(pick.u)} ≈ ${fmt(pick.g)} г`;

      <input class="inp" id="m-q" inputmode="decimal" value="${pick.q}" style="width:96px" aria-label="${pick.custom?'Порций':'Граммов'}"><span>${pick.custom?'порц.':'г'}</span>
      <span class="calc grow num" id="m-calc">= ${fmt(c.kcal)} ккал · ${fmt(c.prot)} г белка</span>

}
function showSug(){
  const inp=$('#m-name'),box=$('#m-sug');if(!inp||!box)return;
  lastSug=findFoods(inp.value);
  if(!lastSug.length||document.activeElement!==inp){box.hidden=true;return}

/* ---------- body ---------- */
function lastWeight(k){
  let best=null;
  for(const x in days){if(isDayKey(x)&&x<=k&&num(days[x].weight)>0&&(!best||x>best))best=x}
  return best?{k:best,w:num(days[best].weight)}:null;
}
function bmiInfo(b){
  if(b<18.5)return {t:'недостаток веса',c:'var(--warn)'};
  if(b<25)return {t:'норма',c:'var(--ok)'};
  if(b<30)return {t:'избыточный вес',c:'var(--warn)'};
  return {t:'ожирение',c:'var(--danger)'};
}
function bodyCard(d){
  const lw=lastWeight(cur), prev=lw?lastWeight(shift(lw.k,-1)):null, h=num(S.height)/100;
  const bmi=lw&&h>0?lw.w/(h*h):0, bi=bmi?bmiInfo(bmi):null, steps=num(d.steps);
  const mark=bmi?Math.max(0,Math.min(100,(bmi-15)/20*100)):0;
  const diff=lw&&prev?lw.w-prev.w:0;
  return `<section class="card" id="sec-body">
    <h2><span class="sw" style="background:var(--mass)"></span>Тело и шаги</h2>
    <div class="grid2">
      <label class="field"><span>Вес${cur===todayKey()?' сегодня':''}, кг</span><input class="inp num" id="w-in" data-day="weight" inputmode="decimal" placeholder="${lw?fmt(lw.w):'например, 70'}" value="${d.weight!=null&&d.weight!==''?esc(String(d.weight).replace('.',',')):''}"></label>
      <label class="field"><span>Шаги</span><input class="inp num" id="st-in" data-day="steps" inputmode="numeric" placeholder="0" value="${d.steps!=null&&d.steps!==''?esc(d.steps):''}"></label>
    </div>
    ${lw?`<p class="note">Последний вес: <b class="num" style="color:var(--ink)">${fmt(lw.w)} кг</b>${lw.k!==cur?' ('+dateLabel(lw.k).toLowerCase()+')':''}${diff?` · <span class="${diff>0?'up':'down'}">${diff>0?'+':'−'}${fmt(Math.abs(diff))} кг</span> к прошлому замеру`:''}${num(S.weightGoal)>0?` · до цели ${fmt(Math.abs(S.weightGoal-lw.w))} кг`:''}</p>`:''}
    ${bmi?`<div class="bmi"><div class="row" style="justify-content:space-between"><span>ИМТ <b class="num">${fmt(bmi)}</b></span><span style="color:${bi.c};font-weight:600">${bi.t}</span></div>
      <div class="bmiscale" aria-hidden="true"><i style="flex:3.5;background:var(--warn)"></i><i style="flex:6.5;background:var(--ok)"></i><i style="flex:5;background:var(--warn)"></i><i style="flex:5;background:var(--danger)"></i><b style="left:${mark}%"></b></div>
      <div class="bmilab num"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>35</span></div></div>`
      :lw?`<p class="note">Чтобы посчитать индекс массы тела, укажите рост во вкладке «Настройки».</p>`:''}
    <div class="row" style="justify-content:space-between;font-size:13.5px;color:var(--muted)"><span>Шаги: <b class="num" style="color:var(--ink)">${fmt(steps)}</b> / ${fmt(S.stepsGoal)}</span><span>${steps>=S.stepsGoal?'Цель выполнена':''}</span></div>
    ${bar(pct(steps,S.stepsGoal),'var(--mass)')}
    ${!steps?'<p class="note">Шаги перепишите из Google Fit или Samsung Health: приложение из браузера не может читать шагомер телефона.</p>':''}
  </section>`;
}

/* ---------- day view ---------- */

  const sl=d.sleep??0;
  const glasses=Math.max(1,Math.round(S.waterGoal/S.glass)), filled=Math.floor(d.water/S.glass);
  const recent=recentMeals();
  const y=day(shift(cur,-1)), carry=y.tasks.filter(t=>!t.done&&!d.tasks.some(x=>x.text===t.text));
  const byCat=CATS.map(c=>({...c,v:sum(d.spend.filter(s=>s.cat===c.id),s=>num(s.amount))})).filter(c=>c.v>0);
  const left=Math.ceil((S.waterGoal-d.water)/S.glass);
  const lw=lastWeight(cur);
  // Water pace: how much should be drunk by now if spread evenly over the waking day
  let pace='';
  if(cur===todayKey()&&d.water<S.waterGoal){
    const now=new Date(),h=now.getHours()+now.getMinutes()/60,from=num(S.waterFrom),to=num(S.waterTo);
    const exp=Math.round(S.waterGoal*Math.max(0,Math.min(1,(h-from)/Math.max(1,to-from)))/50)*50;
    if(exp-d.water>=S.glass){const n=Math.ceil((exp-d.water)/S.glass);pace=`<p class="alert">По графику к ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} нужно было выпить около ${fmt(exp)} мл. Выпейте ${n} ${plural(n,'стакан','стакана','стаканов')}, чтобы догнать.</p>`}
  }

  return `
  ${authReady&&!me&&window.__fb?`<section class="card signin"><h2>Сохранять в облаке</h2><p class="note">Войдите через Google один раз. Данные не пропадут, если сменить или потерять телефон, и будут видны с компьютера.</p>${signinBlock()}</section>`:''}
  <div class="rings">
    ${ring(pct(sl,S.sleepGoal),'var(--sleep)',d.sleep==null?'—':fmt(sl)+' ч','Сон','sec-sleep')}

  </section>

  <section class="card" id="sec-tasks">
    <h2><span class="sw" style="background:var(--accent)"></span>Задачи<span class="hv num">${sum(S.habits,h=>d.habits[h]?1:0)+sum(d.tasks,t=>t.done?1:0)} из ${S.habits.length+d.tasks.length}</span></h2>
    <div class="list">
      ${S.habits.map(h=>`<button class="check ${d.habits[h]?'on':''}" data-act="habit" data-h="${esc(h)}"><span class="box">${d.habits[h]?'✓':''}</span><span class="t">${esc(h)}</span><span class="tag">каждый день</span></button>`).join('')}
      ${d.tasks.map((t,i)=>`<div class="li" style="padding:0"><button class="check ${t.done?'on':''}" style="border:0" data-act="task" data-i="${i}"><span class="box">${t.done?'✓':''}</span><span class="t">${esc(t.text)}</span></button><button class="x" data-act="task-del" data-i="${i}" aria-label="Удалить задачу">×</button></div>`).join('')}
    </div>
    ${carry.length?`<button class="btn ghost sm" data-act="carry">Перенести со вчера: ${carry.length}</button>`:''}
    <form data-form="task" class="row">
      <input class="inp grow" id="t-text" placeholder="Новая задача на день" autocomplete="off">
      <button class="btn">+</button>
    </form>
  </section>`;
}

/* ---------- stats view ---------- */
function chart(vals,labels,goal,color,fmtv){
  const W=320,H=130,top=14,bot=18,left=4,n=vals.length,gap=n>10?2:6;
  const max=Math.max(goal||0,...vals,1)*1.1, bw=(W-left*2-gap*(n-1))/n;
  const y=v=>top+(H-top-bot)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{const x=left+i*(bw+gap),h=Math.max(0,H-bot-y(v));
    s+=`<rect x="${x}" y="${H-bot-h}" width="${bw}" height="${h}" rx="${Math.min(4,bw/3)}" fill="${color}" opacity="${i===n-1?1:.75}"/>`;
    if(n<=10||i%5===0||i===n-1)s+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`;
    if(n<=10&&v>0)s+=`<text x="${x+bw/2}" y="${H-bot-h-3}" text-anchor="middle">${fmtv(v)}</text>`;});
  if(goal)s+=`<line x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/>`;
  return s+'</svg>';
}
function lineChart(vals,labels,color){
  const pts=vals.map((v,i)=>v==null?null:{i,v}).filter(Boolean);
  if(!pts.length)return '<p class="empty">За этот период вес не записан. Впишите его в карточке «Тело и шаги».</p>';
  const W=320,H=130,top=16,bot=18,padL=30,padR=10,n=vals.length;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mx-mn<1){const c=(mx+mn)/2;mn=c-0.5;mx=c+0.5}
  const x=i=>padL+(W-padL-padR)*(n===1?0.5:i/(n-1)), y=v=>top+(H-top-bot)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const g of [mn,mx])s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${padL-4}" y="${y(g)+3}" text-anchor="end">${fmt(g)}</text>`;
  labels.forEach((l,i)=>{if(n<=10||i%5===0||i===n-1)s+=`<text x="${x(i)}" y="${H-5}" text-anchor="middle">${l}</text>`});
  s+=`<path d="${pts.map((p,j)=>(j?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,j)=>{const last=j===pts.length-1;s+=`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${last?4.5:3}" fill="${last?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`});
  const lp=pts[pts.length-1];
  s+=`<text x="${Math.min(x(lp.i),W-padR-14)}" y="${y(lp.v)-9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmt(lp.v)}</text>`;
  return s+'</svg>';
}
function viewStats(){
  const keys=Array.from({length:range},(_,i)=>shift(cur,i-range+1));
  const ds=keys.map(day);
  const labels=keys.map(k=>range<=7?WD[parse(k).getDay()]:String(parse(k).getDate()));
  const avg=a=>{const l=a.filter(v=>v>0);return l.length?sum(l)/l.length:0};
  const sleep=ds.map(d=>d.sleep||0), water=ds.map(d=>d.water), kc=ds.map(kcal), sp=ds.map(spent), pg=ds.map(piggyDelta);
  const totalSp=sum(sp), cats=CATS.map(c=>({...c,v:sum(ds,d=>sum(d.spend.filter(s=>s.cat===c.id),s=>num(s.amount)))}));
  const hitK=kc.filter(v=>v>=S.kcalGoal).length;
  const st=ds.map(d=>num(d.steps)), wv=ds.map(d=>num(d.weight)>0?num(d.weight):null), wl=wv.filter(v=>v!=null);
  const wHead=wl.length>1?((wl[wl.length-1]-wl[0]>=0?'+':'−')+fmt(Math.abs(wl[wl.length-1]-wl[0]))+' кг за период'):wl.length?fmt(wl[0])+' кг':'';
  const block=(title,color,head,vals,goal,f)=>`<section class="card"><h2><span class="sw" style="background:${color}"></span>${title}<span class="hv num">${head}</span></h2><div class="chart">${chart(vals,labels,goal,color,f)}</div></section>`;
  return `
  <div class="seg" role="group" aria-label="Период">
    <button data-range="7" aria-pressed="${range===7}">7 дней</button>
    <button data-range="30" aria-pressed="${range===30}">30 дней</button>
  </div>
  ${block('Сон','var(--sleep)','в среднем '+fmt(avg(sleep))+' ч',sleep,S.sleepGoal,v=>fmt(v))}
  ${block('Калории','var(--food)','в среднем '+fmt(avg(kc))+' · норма '+hitK+' '+plural(hitK,'день','дня','дней'),kc,S.kcalGoal,v=>fmt(v/1000)+'к')}
  ${block('Вода','var(--water)','в среднем '+fmt(avg(water)/1000)+' л',water,S.waterGoal,v=>fmt(v/1000))}
  <section class="card"><h2><span class="sw" style="background:var(--mass)"></span>Вес<span class="hv num">${wHead}</span></h2><div class="chart">${lineChart(wv,labels,'var(--mass)')}</div></section>
  ${block('Шаги','var(--mass)','в среднем '+fmt(avg(st)),st,S.stepsGoal,v=>v>=1000?fmt(v/1000)+'к':fmt(v))}
  ${block('Траты','var(--c-transfer)','всего '+rub(totalSp),sp,0,v=>v>=1000?fmt(v/1000)+'к':fmt(v))}
  <section class="card">
    <h2><span class="sw" style="background:var(--c-transfer)"></span>Траты по категориям<span class="hv">${range} дн.</span></h2>
    <div class="kv">${cats.map(c=>`<span class="lab"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${c.c};flex:none"></span>${c.name}</span><b class="num">${rub(c.v)}</b><div style="grid-column:1/-1">${bar(totalSp?c.v/totalSp:0,c.c)}</div>`).join('')}</div>
  </section>
  <section class="card">
    <h2><span class="sw" style="background:var(--piggy)"></span>Копилка<span class="hv num ${sum(pg)>0?'up':sum(pg)<0?'down':''}">${signed(sum(pg))} за период</span></h2>
    <div class="chart">${chart(pg.map(v=>Math.max(0,v)),labels,0,'var(--piggy)',v=>v>=1000?fmt(v/1000)+'к':fmt(v))}</div>
    <p class="note">Сейчас в копилке ${rub(piggyBalance())}. На графике видно, сколько отложено в каждый день.</p>
  </section>`;
}

/* ---------- settings view ---------- */
function viewSettings(){
  const f=(k,label,unit)=>`<label class="field"><span>${label}${unit?', '+unit:''}</span><input class="inp num" id="set-${k}" data-set="${k}" inputmode="decimal" value="${esc(S[k])}"></label>`;
  const standalone=matchMedia('(display-mode: standalone)').matches;
  return `
  <section class="card">
    <h2>Аккаунт</h2>
    ${me?`<div class="who">${me.photo?`<img src="${esc(me.photo)}" alt="" referrerpolicy="no-referrer">`:''}<div><b>${esc(me.name||'Вы вошли')}</b><br><span class="note">${esc(me.email)}</span></div></div>
      <p class="note">Данные хранятся в телефоне и копируются в облако, когда есть интернет.</p>
      <button class="btn ghost" data-act="logout">Выйти</button>`
    :`<p class="note">Сейчас данные хранятся только на этом телефоне. После входа они будут копироваться в облако, а то, что уже записано, перенесётся.</p>
      ${tab==='settings'&&window.__fb?signinBlock():''}`}
  </section>
  <section class="card">
    <h2>Цели на день</h2>
    <div class="grid2">
      ${f('kcalGoal','Калории','ккал')}${f('protGoal','Белок','г')}
      ${f('waterGoal','Вода','мл')}${f('glass','Стакан','мл')}
      ${f('sleepGoal','Сон','ч')}${f('stepsGoal','Шаги','')}
      ${f('waterFrom','Пью воду с','ч')}${f('waterTo','до','ч')}
    </div>
    <p class="note">Для набора массы обычно берут свою норму поддержания плюс 300–500 ккал и 1,6–2 г белка на килограмм веса. Если вес за 2 недели не растёт, добавьте ещё 200 ккал.</p>
  </section>
  <section class="card">
    <h2>Тело</h2>
    <div class="grid2">${f('height','Рост','см')}${f('weightGoal','Желаемый вес','кг')}</div>
    <p class="note">Рост нужен для индекса массы тела (ИМТ). Норма ИМТ — от 18,5 до 25.</p>
  </section>
  <section class="card">
    <h2>Мои блюда</h2>
    <div class="list">${(S.customFoods||[]).map((c,i)=>`<div class="li"><span class="t">${esc(c.n)}<small>${fmt(num(c.k))} ккал${num(c.p)?' · белок '+fmt(num(c.p))+' г':''} за порцию</small></span><button class="x" data-act="food-del" data-i="${i}" aria-label="Удалить">×</button></div>`).join('')||'<p class="empty">Пока пусто. Блюда, которые вы впишете вручную с калориями, появятся здесь и в поиске.</p>'}</div>
  </section>
  <section class="card">
    <h2>Копилка</h2>
    <div class="grid2">${f('piggyStart','Уже накоплено','₽')}${f('piggyGoal','Цель','₽')}</div>
    <p class="note">Баланс = уже накоплено + всё, что вы отложили или сняли по дням.</p>
  </section>
  <section class="card">
    <h2>Ежедневные привычки</h2>
    <div class="list">${S.habits.map((h,i)=>`<div class="li"><span class="t">${esc(h)}</span><button class="x" data-act="habit-del" data-i="${i}" aria-label="Удалить">×</button></div>`).join('')||'<p class="empty">Пока нет привычек.</p>'}</div>
    <form data-form="habit" class="row"><input class="inp grow" id="h-text" placeholder="Например: 10 000 шагов" autocomplete="off"><button class="btn">Добавить</button></form>
    <p class="note">Привычки каждый день появляются в «Задачах».</p>
  </section>
  <section class="card">
    <h2>Резервная копия</h2>
    <div class="row"><button class="btn ghost grow" data-act="export">Скачать копию</button><button class="btn ghost grow" data-act="import">Загрузить из файла</button></div>
    <p class="note">Файл .json со всеми днями и настройками. При загрузке совпадающие дни заменяются данными из файла.</p>
  </section>
  ${standalone?'':`<section class="card">
    <h2>Установить на телефон</h2>
    ${installEvt?`<button class="btn" data-act="install">Установить приложение</button>`:`<p class="note">В Chrome нажмите ⋮ → «Добавить на главный экран» или «Установить приложение».</p>`}
  </section>`}`;
}

/* ---------- render ---------- */
function render(){
  const view=$('#view');
  const keep={};view.querySelectorAll('input[id]:not([type=radio])').forEach(i=>{if(i.value&&!i.dataset.set&&!i.dataset.time&&!i.dataset.day)keep[i.id]=i.value});
  const ae=document.activeElement, aid=ae&&view.contains(ae)?ae.id:null, sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null, aval=aid?ae.value:null;
  $('#dlabel').textContent=tab==='settings'?'Настройки':tab==='stats'?(range===7?'Последние 7 дней':'Последние 30 дней'):dateLabel(cur);
  $('#prev').hidden=$('#next').hidden=tab==='settings';
  view.innerHTML=tab==='day'?viewDay():tab==='stats'?viewStats():viewSettings();
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(aval!=null)el.value=aval;if(sel)try{el.setSelectionRange(...sel)}catch(e){}}}
  if(aid==='m-name')showSug();
  document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
let toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- events ---------- */
$('#prev').onclick=()=>{cur=shift(cur,-1);render()};
$('#next').onclick=()=>{cur=shift(cur,1);render()};
$('#datebtn').onclick=()=>{cur=todayKey();if(tab==='settings')tab='day';render();scrollTo({top:0})};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();scrollTo({top:0})};

$('#view').addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]');
  if(go){document.getElementById(go.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  const r=e.target.closest('[data-range]');
  if(r){range=+r.dataset.range;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,v=num(b.dataset.v);
  if(a==='sleep')mutate(cur,d=>{d.sleep=Math.max(0,Math.min(24,(d.sleep??S.sleepGoal-v)+v))});
  if(a==='water')mutate(cur,d=>{d.water=Math.max(0,d.water+v)});
  if(a==='meal-del')mutate(cur,d=>d.meals.splice(i,1));
  if(a==='meal-quick'){const m=recentMeals()[i];if(m){mutate(cur,d=>d.meals.push({name:m.name,kcal:num(m.kcal),prot:num(m.prot)}));toast('Добавлено: '+m.name)}}
  if(a==='spend-del')mutate(cur,d=>d.spend.splice(i,1));
  if(a==='piggy-del')mutate(cur,d=>d.piggy.splice(i,1));
  if(a==='habit'){const h=b.dataset.h;mutate(cur,d=>{d.habits[h]=!d.habits[h]})}
  if(a==='task')mutate(cur,d=>{d.tasks[i].done=!d.tasks[i].done});
  if(a==='task-del')mutate(cur,d=>d.tasks.splice(i,1));
  if(a==='carry'){const y=day(shift(cur,-1));mutate(cur,d=>y.tasks.filter(t=>!t.done&&!d.tasks.some(x=>x.text===t.text)).forEach(t=>d.tasks.push({text:t.text,done:false})))}
  if(a==='habit-del')setSettings(s=>s.habits.splice(i,1));
  if(a==='food-del')setSettings(s=>s.customFoods.splice(i,1));
  if(a==='pickfood'){const f=lastSug[i];if(f){pick={...f,q:f.custom?1:f.g};const inp=$('#m-name');if(inp){inp.value=f.n;inp.blur()}render()}}
  if(a==='unpick'){pick=null;render()}
  if(a==='qty'&&pick){pick.q=v;render()}
  if(a==='login')login();
  if(a==='logout')logout();
  if(a==='export')exportData();
  if(a==='import')$('#importfile').click();
  if(a==='install'&&installEvt){installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;render()}
});

$('#view').addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target.dataset.form,val=id=>document.getElementById(id).value.trim(),clear=(...ids)=>ids.forEach(id=>document.getElementById(id).value='');
  if(f==='meal'){
    if(pick){
      const c=calcPick(),q=num(pick.q);
      if(q<=0){toast('Укажите количество');return}
      const name=pick.custom?(q===1?pick.n:pick.n+' ×'+fmt(q)):pick.n+' · '+fmt(q)+' г';
      pick=null;clear('m-name');
      mutate(cur,d=>d.meals.push({name,kcal:Math.round(c.kcal),prot:Math.round(c.prot*10)/10}));
      return;
    }
    const name=val('m-name'),kc=num(val('m-kcal')),pr=num(val('m-prot'));
    if(!kc&&!name){document.getElementById('m-name').focus();return}
    if(name&&!kc){toast(findFoods(name).length?'Выберите блюдо из списка или впишите калории':'Такого блюда нет в списке. Впишите калории');return}
    clear('m-name','m-kcal','m-prot');
    if(name&&kc>0&&!knownFood(name)){S.customFoods=[...(S.customFoods||[]),{n:name,k:kc,p:pr}];persist('settings');toast('Запомнил «'+name+'», в следующий раз найдётся в поиске')}
    mutate(cur,d=>d.meals.push({name,kcal:kc,prot:pr}));
  }
  if(f==='spend'){
    const amt=num(val('s-amt'));const cat=e.target.querySelector('input[name=cat]:checked')?.value||'other';
    if(amt<=0){toast('Впишите сумму больше нуля');document.getElementById('s-amt').focus();return}
    lastCat=cat;const note=val('s-note');clear('s-amt','s-note');mutate(cur,d=>d.spend.push({cat,amount:amt,note}));
  }
  if(f==='piggy'){
    const amt=num(val('p-amt'));if(amt<=0){toast('Впишите сумму больше нуля');return}
    const sign=e.submitter&&e.submitter.value==='out'?-1:1;clear('p-amt');mutate(cur,d=>d.piggy.push({amount:sign*amt,note:''}));
    toast(sign>0?'Отложено '+rub(amt):'Снято '+rub(amt));
  }
  if(f==='task'){const t=val('t-text');if(!t)return;clear('t-text');mutate(cur,d=>d.tasks.push({text:t,done:false}))}
  if(f==='email'){emailAuth(e.submitter&&e.submitter.value==='new');return}
  if(f==='habit'){const t=val('h-text');if(!t||S.habits.includes(t))return;clear('h-text');setSettings(s=>s.habits.push(t))}
});

$('#view').addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='m-name'){if(pick&&el.value!==pick.n){pick=null;render()}showSug()}
  if(el.id==='m-q'&&pick){
    pick.q=num(el.value);const c=calcPick(),t=$('#m-calc');
    if(t)t.textContent='= '+fmt(c.kcal)+' ккал · '+fmt(c.prot)+' г белка';
    document.querySelectorAll('[data-act=qty]').forEach(b=>b.classList.toggle('sel',num(b.dataset.v)===pick.q));
  }
});
$('#view').addEventListener('focusin',e=>{if(e.target.id==='m-name')showSug()});
$('#view').addEventListener('focusout',e=>{if(e.target.id==='m-name')setTimeout(()=>{const b=$('#m-sug');if(b&&document.activeElement!==$('#m-name'))b.hidden=true},150)});
// keep the name field focused while a suggestion is tapped
$('#view').addEventListener('pointerdown',e=>{if(e.target.closest('.sug'))e.preventDefault()});

$('#view').addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.day){const k=el.dataset.day,raw=el.value.trim(),v=raw===''?null:num(raw);if(v!=null&&v<0)return;mutate(cur,d=>{d[k]=v})}
  if(el.dataset.set){const k=el.dataset.set;const n=num(el.value);if(n<0)return;setSettings(s=>{s[k]=n});toast('Сохранено')}
  if(el.dataset.time){
    const k=el.dataset.time,v=el.value;
    mutate(cur,d=>{d[k]=v;if(d.bed&&d.wake){const [bh,bm]=d.bed.split(':').map(Number),[wh,wm]=d.wake.split(':').map(Number);let m=(wh*60+wm)-(bh*60+bm);if(m<=0)m+=1440;d.sleep=Math.round(m/30)/2}});
  }
});

addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='settings')render()});
addEventListener('online',()=>{if(fs&&sync==='offline')setSync('pending')});
addEventListener('offline',()=>{if(fs)setSync('offline')});

/* midnight rollover: keep "today" fresh if the app stays open */
let lastToday=todayKey();
setInterval(()=>{const t=todayKey();if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;render()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=todayKey();if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;render()}}});

if('serviceWorker' in navigator){
  // When a new version takes over, reload once so the fresh code runs right away
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn('SW',e));
}

loadLocal();setSync('local');render();initFirebase();
</script>
